<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📸 사진 데이터 프레임 생성기</title>
    <style>
        body {
            background-color: #FBF9F6;
            color: #222222;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0px 8px 24px rgba(149, 157, 165, 0.06);
            border: 1px solid #E2DFD9;
        }
        h1 { margin-top: 0; font-size: 1.8rem; }
        .info-text { color: #6E6E6E; font-size: 0.95rem; margin-bottom: 25px; }
        
        .upload-card {
            border: 2px dashed #E2DFD9;
            padding: 20px;
            border-radius: 12px;
            background-color: #FAF8F5;
            margin-bottom: 20px;
        }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 0.9rem; }
        select, input[type="text"], input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            background-color: #fff;
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        button {
            background-color: #222222;
            color: #ffffff;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #444444; }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            color: #555;
        }

        #result-section {
            margin-top: 30px;
            display: none;
            text-align: center;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        #result-img {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📸 사진 데이터 프레임 생성기</h1>
    <p class="info-text">디지털 사진에 카메라 기종, 렌즈 정보, 촬영 정보(EXIF), 그리고 감성적인 즉석 인화 카메라 스타일 테두리를 입혀줍니다.</p>

    <form id="upload-form">
        <div class="upload-card">
            <label>📁 사진 파일 선택 (JPG, RAW 등)</label>
            <input type="file" id="file-input" accept="image/*,.jpg,.jpeg,.png,.arw,.cr2,.cr3,.nef,.dng,.orf,.rw2" required>
        </div>

        <details style="margin-bottom: 20px; background: #fdfdfd; border: 1px solid #eee; border-radius: 8px; padding: 10px;">
            <summary style="font-weight: bold; cursor: pointer; padding: 5px;">⚙️ 촬영 및 렌즈/화각 정보 수동 입력 (선택사항)</summary>
            <div class="grid-4" style="margin-top: 15px;">
                <div class="form-group">
                    <label>🏷️ 브랜드</label>
                    <select id="brand-select">
                        {% for b in brands %}
                        <option value="{{ b }}">{{ b }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>🎞️ 렌즈 선택</label>
                    <select id="lens-select"></select>
                    <input type="text" id="custom-lens" placeholder="예: Jupiter-8 50mm f/2.0" style="display:none; margin-top:5px;">
                </div>
                <div class="form-group">
                    <label>📐 화각 선택</label>
                    <select id="focal-select">
                        {% for f in focal_lengths %}
                        <option value="{{ f }}">{{ f }}</option>
                        {% endfor %}
                    </select>
                    <input type="text" id="custom-focal" placeholder="예: 40mm" style="display:none; margin-top:5px;">
                </div>
                <div class="form-group">
                    <label>🔘 조리개 (f/)</label>
                    <select id="f-select">
                        {% for fn in f_numbers %}
                        <option value="{{ fn }}">{{ fn }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </details>

        <div class="form-group">
            <label>🌍 적용할 타임존 (GPS 정보 없을 시 사용)</label>
            <select id="tz-select">
                {% for tz in timezones %}
                <option value="{{ tz }}" {% if 'UTC+09:00' in tz %}selected{% endif %}>{{ tz }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit">✨ 프레임 생성하기</button>
    </form>

    <div class="loading" id="loading">⏳ 고화질 변환 중입니다... (RAW 변환 시 수 초가 걸릴 수 있습니다)</div>

    <div id="result-section">
        <h3>🖼️ 생성 결과물</h3>
        <img id="result-img" src="" alt="변환 이미지">
    </div>
</div>

<script>
    const lensesByBrand = {{ lenses_by_brand | tojson }};
    const brandSelect = document.getElementById('brand-select');
    const lensSelect = document.getElementById('lens-select');
    const customLens = document.getElementById('custom-lens');
    const focalSelect = document.getElementById('focal-select');
    const customFocal = document.getElementById('custom-focal');

    function updateLenses() {
        const brand = brandSelect.value;
        const lenses = lensesByBrand[brand] || ["EXIF 정보 사용"];
        lensSelect.innerHTML = '';
        lenses.forEach(l => {
            const opt = document.createElement('option');
            opt.value = l;
            opt.textContent = l;
            lensSelect.appendChild(opt);
        });
        customLens.style.display = (lensSelect.value === '사용자 지정 입력') ? 'block' : 'none';
    }

    brandSelect.addEventListener('change', updateLenses);
    lensSelect.addEventListener('change', () => {
        customLens.style.display = (lensSelect.value === '사용자 지정 입력') ? 'block' : 'none';
    });
    focalSelect.addEventListener('change', () => {
        customFocal.style.display = (focalSelect.value === '직접 입력') ? 'block' : 'none';
    });

    updateLenses();

    document.getElementById('upload-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fileInput = document.getElementById('file-input');
        if (!fileInput.files[0]) return;

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        let lensVal = lensSelect.value === '사용자 지정 입력' ? customLens.value : (lensSelect.value !== 'EXIF 정보 사용' ? lensSelect.value : '');
        let focalVal = focalSelect.value === '직접 입력' ? customFocal.value : (focalSelect.value !== 'EXIF 유지' ? focalSelect.value : '');
        let fVal = document.getElementById('f-select').value !== 'EXIF 유지' ? document.getElementById('f-select').value : '';

        formData.append('override_lens', lensVal);
        formData.append('override_focal', focalVal);
        formData.append('override_f', fVal);
        formData.append('chosen_utc', document.getElementById('tz-select').value);

        document.getElementById('loading').style.display = 'block';
        document.getElementById('result-section').style.display = 'none';

        try {
            const res = await fetch('/process', { method: 'POST', body: formData });
            if (!res.ok) {
                const errData = await res.json();
                throw new Error(errData.error || '변환 실패');
            }

            const blob = await res.blob();
            const url = URL.createObjectURL(blob);

            document.getElementById('result-img').src = url;
            document.getElementById('result-section').style.display = 'block';

            // 이미지 클릭 또는 자동 다운로드 안내
            const a = document.createElement('a');
            a.href = url;
            const contentDisposition = res.headers.get('Content-Disposition');
            let fileName = 'result.jpg';
            if (contentDisposition && contentDisposition.includes('filename=')) {
                fileName = contentDisposition.split('filename=')[1].replace(/"/g, '');
            }
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            a.remove();

        } catch (err) {
            alert(err.message);
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    });
</script>
</body>
</html>
